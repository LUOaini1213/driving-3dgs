name: Public viewer artifact

on:
  pull_request:
    paths:
      - "site/**"
      - "scripts/build_viewer.py"
      - "docs/splat/full_7k.splat"
      - "docs/img/viewer_headless.jpg"
      - "results/web_export.json"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Pinned viewer dependencies (no lifecycle scripts)
        run: npm ci --prefix site --ignore-scripts --no-audit --no-fund
      - name: JavaScript syntax
        run: |
          node --check site/viewer.js
          node --check site/viewer-frame.js
      - name: Isolated artifact and original asset integrity
        run: |
          python scripts/build_viewer.py --require-clean
          python scripts/build_viewer.py --check --require-clean
      - name: Upload only the checked static artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: driving-viewer-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Deploy reviewed artifact (manual dispatch on master only)
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
