name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install (CPU-only torch; training needs a GPU and is not run in CI)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Unit tests (pose math, split, metrics, masks, lidar guard, splat export)
        run: python -m pytest -q
      - name: README numbers match results JSON
        run: python scripts/check_readme.py --check
      - name: Mutation checks (isolated CPU tests, no GPU or dataset download)
        run: python scripts/mutation_check.py --no-report
      - name: Preserve mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-evidence-${{ matrix.os }}
          path: mutation-artifacts/
          if-no-files-found: error
